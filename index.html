<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoho Templates Manager</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- SweetAlert2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- DataTables CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css" />
  <!-- DataTables Responsive CSS -->
  <link rel="stylesheet" type="text/css"
    href="https://cdn.datatables.net/responsive/2.4.1/css/responsive.bootstrap5.min.css" />
  <!-- DateRangePicker CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

  <!-- Tu CSS Personalizado -->
  <!-- Tu CSS Personalizado -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="institute-colors.css">
  <link rel="stylesheet" href="pagination.css">
</head>

<body>

  <!-- Cargador global -->
  <div id="loader" class="loading-overlay hidden">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 fw-bold">Sincronizando...</p>
    </div>
  </div>

  <!-- SECCIÓN LOGIN -->
  <section id="loginSection" class="login-section d-flex align-items-center justify-content-center min-vh-100 hidden">
    <div class="login-container">
      <div class="login-card shadow-sm">
        <div class="login-header text-center mb-4">
          <div class="login-icon-badge mb-3">
            <i class="fas fa-layer-group"></i>
          </div>
          <h4 class="login-title">Gestión Zoho OSE</h4>
          <p class="login-subtitle text-muted">Ingresa tus credenciales para acceder al sistema</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); attemptLogin();">
          <div class="form-floating mb-3">
            <input type="text" id="userInput" class="form-control" placeholder="Usuario" autocomplete="username" required>
            <label for="userInput"><i class="fas fa-user me-2 text-muted"></i>Usuario</label>
          </div>

          <div class="form-floating mb-4 position-relative">
            <input type="password" id="passInput" class="form-control pe-5" placeholder="Contraseña" autocomplete="current-password" required>
            <label for="passInput"><i class="fas fa-lock me-2 text-muted"></i>Contraseña</label>
            <button type="button" class="btn btn-password-toggle" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar contraseña" tabindex="-1">
              <i class="far fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>

          <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-3 fw-semibold btn-login">
            <span>INGRESAR</span>
            <i class="fas fa-arrow-right ms-2"></i>
          </button>
        </form>

        <div id="loginError" class="login-error-alert text-danger mt-3 text-center small hidden"></div>

        <div class="login-footer text-center mt-4">
          <span class="text-muted small"><i class="fas fa-shield-alt me-1"></i> Portal Seguro de Plantillas</span>
        </div>
      </div>
    </div>
  </section>

  <!-- SECCIÓN PANEL DE CONTROL -->
  <main id="mainSection" class="dashboard-section container-fluid hidden p-4">
    <!-- Header / Navbar Principal -->
    <header class="dashboard-header d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3">
      <div class="d-flex align-items-center gap-3">
        <div class="dashboard-brand-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        <div>
          <h3 class="dashboard-title mb-0">Panel de Plantillas Zoho</h3>
          <p class="dashboard-subtitle text-muted mb-0">Gestión y homologación de plantillas para mensajería</p>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3 mt-3 mt-md-0">
        <div id="userProfilePill" class="user-profile-pill">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="user-info">
            <span id="userNameDisplay" class="user-name">Usuario</span>
            <span id="userRoleBadge" class="user-role-badge">ROL</span>
          </div>
        </div>
        <button id="btnNuevo" class="btn btn-nuevo-record hidden" onclick="openEdit(-1)">
          <i class="fas fa-plus me-1"></i> Nueva Petición
        </button>
        <button class="btn btn-logout" onclick="clearSession()" title="Cerrar sesión">
          <i class="fas fa-sign-out-alt me-1"></i> Salir
        </button>
      </div>
    </header>

    <!-- Barra de Filtros -->
    <div class="filter-card shadow-sm mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-lg-3 col-md-6">
          <div class="input-icon-wrapper">
            <i class="far fa-calendar-alt input-icon"></i>
            <input type="text" id="dateRangeFilter" class="form-control form-control-filter ps-5" placeholder="Filtrar por fecha..." readonly>
          </div>
        </div>
        <div class="col-lg-2 col-md-3">
          <div class="input-icon-wrapper">
            <i class="fas fa-tag input-icon"></i>
            <select id="statusFilter" class="form-select form-control-filter ps-5" onchange="renderTable()">
              <option value="">Todos los Estados</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Completado">Completado</option>
              <option value="Observado">Observado</option>
              <option value="A la espera">A la espera</option>
            </select>
          </div>
        </div>
        <div class="col-lg-2 col-md-3">
          <div class="input-icon-wrapper">
            <i class="fas fa-building input-icon"></i>
            <select id="brandFilter" class="form-select form-control-filter ps-5" onchange="renderTable()">
              <option value="">Todas las Marcas</option>
              <option value="JVN" class="opt-neumann">JVN</option>
              <option value="IEMPRESA" class="opt-empresa">IEMPRESA</option>
              <option value="BLACKWELL" class="opt-blackwell">BLACKWELL</option>
              <option value="ITAE" class="opt-itae">ITAE</option>
            </select>
          </div>
        </div>
        <div class="col-lg-5 col-md-12">
          <div class="d-flex gap-2">
            <div class="input-group search-input-group flex-grow-1">
              <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
              <input type="text" id="nameFilter" class="form-control form-control-filter border-start-0 ps-1" placeholder="Buscar por nombre de plantilla..." oninput="renderTable()">
            </div>
            <button class="btn btn-clear-filter" onclick="clearFilters()" title="Restablecer filtros">
              <i class="fas fa-rotate-left me-1"></i> Limpiar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenedor de la Tabla -->
    <div class="table-card shadow-sm">
      <div class="table-responsive">
        <table class="table modern-table align-middle mb-0">
          <thead id="tableHeader">
            <!-- Headers generados dinámicamente -->
          </thead>
          <tbody id="tableBody">
            <!-- Filas generadas dinámicamente -->
          </tbody>
        </table>
      </div>
      <!-- Controles de Paginación -->
      <div id="paginationControls" class="pagination-wrapper p-3 border-top"></div>
    </div>
  </main>

  <!-- MODAL PARA REGISTRO Y EDICIÓN -->
  <div class="modal fade" id="editModal" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content modern-modal">
        <div class="modal-header d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <div class="modal-title-icon" id="modalTitleIcon">
              <i class="fas fa-pen-to-square"></i>
            </div>
            <div>
              <div class="d-flex align-items-center gap-2">
                <h5 class="modal-title mb-0" id="modalTitle">Editar Registro</h5>
                <span id="modalRecordBadge" class="modal-record-badge"></span>
              </div>
              <p class="modal-subtitle text-muted mb-0" id="modalSubtitle">Gestiona los parámetros y contenido de la plantilla</p>
            </div>
          </div>
          <button type="button" class="btn-close-modal" data-bs-dismiss="modal" aria-label="Cerrar">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="modal-body p-4">
          <div id="editForm">
            <!-- Fields generated dynamically by section -->
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-modal-cancel" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i> Cancelar
          </button>
          <button type="button" id="btnModalSave" class="btn btn-modal-save" onclick="saveData()">
            <i class="fas fa-save me-1"></i> Guardar Cambios
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="text/javascript" src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
  <script type="text/javascript" src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>
  <script type="text/javascript"
    src="https://cdn.datatables.net/responsive/2.4.1/js/dataTables.responsive.min.js"></script>
  <script type="text/javascript"
    src="https://cdn.datatables.net/responsive/2.4.1/js/responsive.bootstrap5.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>

  <!-- Tu Lógica JS -->
  <script src="index.js"></script>
</body>

</html>
